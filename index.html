<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="theme-color" content="#1E5E48">
<meta name="description" content="Konker, Seka, Injera Bewet and Dama in Amharic and English. Works offline.">
<title>Habesha Games</title>
<script src="analytics-config.js"></script>
<script src="telemetry.js"></script>
<style>
:root{--bg:#EDF1EC;--surface:#fff;--ink:#1C2924;--muted:#566660;--green:#1E5E48;--gold:#C2902A;--berry:#9E3446;--line:#C9D4CD}
@media (prefers-color-scheme:dark){:root{--bg:#121D19;--surface:#1B2A24;--ink:#E7EFEA;--muted:#A3B5AC;--green:#6CC3A0;--gold:#E3B652;--berry:#E07A8A;--line:#33483F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 system-ui,"Kefa",sans-serif}
html[lang="am"] body{font-family:"Kefa",system-ui,sans-serif}
.tibeb{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 14px,var(--gold) 14px 18px,var(--berry) 18px 30px,var(--gold) 30px 34px);border-bottom:4px solid var(--gold)}
main{max-width:900px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.9rem;text-wrap:balance}h2{margin:0;font-size:1.2rem}
.lang,.sw{min-height:52px;padding:8px 20px;border-radius:999px;border:2px solid var(--green);color:var(--green);font:inherit;font-weight:700;background:var(--surface);cursor:pointer}
.lang:focus-visible,.sw:focus-visible,a.app:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
a.app{display:flex;gap:18px;align-items:center;min-height:120px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;color:inherit;text-decoration:none}
a.app:hover{border-color:var(--green)}a.app img{width:88px;height:88px;border-radius:20px;flex:none}a.app b{font-size:1.3rem;display:block}a.app span{color:var(--muted);font-size:1rem}
.box{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.box.gold{border-color:var(--gold)}.box ol,.box ul{margin:0;padding-left:1.3em}.box li{margin:4px 0}
.muted{color:var(--muted);font-size:1rem}a{color:var(--green)}
</style>
</head>
<body>
<div class="tibeb"></div>
<main>
<div class="top"><h1 data-am="የሐበሻ ጨዋታዎች" data-en="Habesha Games">Habesha Games</h1><button class="lang" type="button" id="langBtn">አማርኛ</button></div>
<p class="muted" data-am="ኮንከር፣ ሴካ፣ እንጀራ በወጥ እና ዳማ በአማርኛ እና በእንግሊዝኛ። ያለ ኢንተርኔትም ይሠራል።" data-en="Konker, Seka, Injera Bewet and Dama, in Amharic and English. Works without internet."></p>
<div class="apps">
<a class="app" href="cards/index.html"><img src="cards/icon-180.png" alt=""><div><b data-am="የካርታ ጨዋታዎች" data-en="Card Games"></b><span data-am="ኮንከር · ሴካ · እንጀራ በወጥ" data-en="Konker · Seka · Injera Bewet"></span></div></a>
<a class="app" href="dama/index.html"><img src="dama/icon-180.png" alt=""><div><b data-am="ዳማ" data-en="Dama"></b><span data-am="በእንጨት ሰሌዳ ላይ" data-en="Checkers on a wooden board"></span></div></a>
</div>
<div class="box gold">
<h2 data-am="እንዴት እንደሚጫን" data-en="How to install"></h2>
<ol>
<li data-am="አይፓድ ወይም አይፎን፦ በSafari ይክፈቱ፣ የማጋሪያ ምልክቱን (□↑) ይንኩና «Add to Home Screen» ይምረጡ።" data-en="iPad or iPhone: open this page in Safari, tap the Share button (□↑), then “Add to Home Screen.”"></li>
<li data-am="አንድሮይድ፦ በChrome ይክፈቱ፣ ⋮ ምናሌውን ይንኩና «Install app» ወይም «Add to Home screen» ይምረጡ።" data-en="Android: open this page in Chrome, tap the ⋮ menu, then “Install app” or “Add to Home screen.”"></li>
<li data-am="ከዚያ ሁልጊዜ ከHome Screen ምልክቱ ይክፈቱት፤ ያለ ኢንተርኔትም ይሠራል።" data-en="From then on, open it from its Home Screen icon. It works without internet."></li>
</ol>
</div>
<div class="box">
<h2 data-am="ግላዊነት" data-en="Privacy"></h2>
<p class="muted" style="margin:0" data-am="ስሞች እና ነጥቦች በዚህ መሣሪያ ላይ ብቻ ይቀመጣሉ።" data-en="Names and scores are saved only on this device."></p>
<p class="muted" style="margin:0" data-am="ጨዋታዎቹን ለማሻሻል የትኞቹ ጨዋታዎች እንደሚጫወቱ ብቻ እንቆጥራለን፦ የጨዋታው ስም፣ የተጫዋቾች ብዛት፣ ከኮምፒውተር ወይም ከሰው ጋር፣ ደረጃ እና ቋንቋ። ስም፣ ነጥብ፣ ጾታ ወይም የሚጽፉት ምንም ነገር አይላክም። ምዝገባ የለም፤ ኩኪም የለም።" data-en="To improve the games, we count only which games are played: the game name, number of players, against the computer or people, level and language. Names, scores, gender or anything you type are never sent. No sign-up, no cookies."></p>
<div><button class="sw" type="button" id="countBtn"></button></div>
<a href="privacy.html" data-am="ሙሉ የግላዊነት መግለጫ" data-en="Full privacy note"></a>
</div>
</main>
<script>
window.onLang=function(l){var b=document.getElementById("countBtn"),off=window.gamesCounting&&gamesCounting.off();
  b.textContent=l==="am"?(off?"መቁጠር ጠፍቷል · አብራ":"መቁጠር በርቷል · አጥፋ"):(off?"Counting is off · Turn on":"Counting is on · Turn off");
  document.title=l==="am"?"የሐበሻ ጨዋታዎች":"Habesha Games"};
document.getElementById("countBtn").onclick=function(){if(!window.gamesCounting)return;gamesCounting.setOff(!gamesCounting.off());window.onLang(document.documentElement.lang)};
</script>
<script>
(function(){
  var lang="en";try{lang=localStorage.getItem("games.lang")||((navigator.language||"").indexOf("am")===0?"am":"en")}catch(e){}
  function apply(){document.documentElement.lang=lang;
    document.querySelectorAll("[data-am]").forEach(function(el){el.innerHTML=el.getAttribute(lang==="am"?"data-am":"data-en")});
    var b=document.getElementById("langBtn");if(b)b.textContent=lang==="am"?"English":"አማርኛ";if(window.onLang)window.onLang(lang)}
  document.getElementById("langBtn").onclick=function(){lang=lang==="am"?"en":"am";try{localStorage.setItem("games.lang",lang)}catch(e){}apply()};
  window.addEventListener("pageshow",function(){try{var l=localStorage.getItem("games.lang");if(l&&l!==lang){lang=l;apply()}}catch(e){}});
  apply();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}</script>
</body>
</html>
