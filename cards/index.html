:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --ink:#1C2924; --muted:#566660;
  --green:#1E5E48; --green-soft:#D6E7DE; --gold:#C2902A; --gold-soft:#F4E6C4;
  --berry:#9E3446; --berry-soft:#F6DDE1; --line:#C9D4CD; --ok:#2E7D4F; --warn:#B4532A;
  --f-body:"Atkinson Hyperlegible","Fidel Serif","Kefa",system-ui,sans-serif;
  --f-geez:"Fidel Serif","Kefa",serif;
  --r:18px;
  --weave:repeating-linear-gradient(45deg,var(--green) 0 10px,var(--gold) 10px 14px,var(--berry) 14px 22px,var(--gold) 22px 26px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121D19; --surface:#1B2A24; --ink:#E7EFEA; --muted:#A3B5AC;
  --green:#6CC3A0; --green-soft:#24443A; --gold:#E3B652; --gold-soft:#43381E;
  --berry:#E07A8A; --berry-soft:#4A2730; --line:#33483F; --ok:#6FD39A; --warn:#F09A6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121D19; --surface:#1B2A24; --ink:#E7EFEA; --muted:#A3B5AC;
  --green:#6CC3A0; --green-soft:#24443A; --gold:#E3B652; --gold-soft:#43381E;
  --berry:#E07A8A; --berry-soft:#4A2730; --line:#33483F; --ok:#6FD39A; --warn:#F09A6E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang="am"] body{font-family:"Fidel Serif","Kefa",var(--f-body)}
img{max-width:100%}
.tibeb{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 14px,var(--gold) 14px 18px,var(--berry) 18px 30px,var(--gold) 30px 34px);border-bottom:4px solid var(--gold)}
.tibeb.thin{height:10px;border-bottom-width:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
.muted{color:var(--muted)} .small{font-size:.9rem}
.am{font-family:var(--f-geez)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{min-height:58px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn.primary{background:var(--green);color:var(--surface)}
.btn.ghost{background:var(--surface);border:2px solid var(--line)}
.btn.gold{background:var(--gold-soft);border:2px solid var(--gold)}

<script>
/* ---------- shared helpers ---------- */
const $=id=>document.getElementById(id);

const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayStr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function makeLS(prefix){return{get(k,d){try{const v=localStorage.getItem(prefix+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(prefix+k,JSON.stringify(v));return true}catch(e){return false}}}}

/* Storage: IndexedDB (roomy, holds photos) with localStorage as a second copy (text only). */
function makeKV(dbName){
 let db=null;
 const ready=new Promise(res=>{
  try{if(!window.indexedDB)return res(false);
   const r=indexedDB.open(dbName,1);
   r.onupgradeneeded=()=>r.result.createObjectStore("kv");
   r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false);
   setTimeout(()=>res(!!db),2500);
  }catch(e){res(false)}
 });
 const tx=(mode,fn)=>new Promise((res,rej)=>{try{const t=db.transaction("kv",mode);const st=t.objectStore("kv");const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}});
 return{ready,
  async get(k){await ready;if(!db)return undefined;try{return await tx("readonly",s=>s.get(k))}catch(e){return undefined}},
  async set(k,v){await ready;if(!db)return false;try{await tx("readwrite",s=>s.put(v,k));return true}catch(e){return false}}};
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

function shrinkImage(file,max=800,q=.75){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}
/* Save a backup: on Computer the share sheet ("Save to Files"); elsewhere a normal download. Resolves true when saved. */
async function downloadJSON(obj,filename){
 const text=JSON.stringify(obj);
 try{const file=new File([text],filename,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&"ontouchend" in document){
   await navigator.share({files:[file],title:filename});return true}}
 catch(e){if(e&&e.name==="AbortError")return false}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=filename;
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return true;
}
function readText(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsText(file)})}
let toastTimer=null;
function toast(msg,actionLabel,action){
 let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el)}
 el.innerHTML=`<span></span>`;el.firstChild.textContent=msg;
 if(actionLabel){const b=document.createElement("button");b.type="button";b.textContent=actionLabel;b.onclick=()=>{el.hidden=true;action()};el.appendChild(b)}
 el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,actionLabel?7000:2600);
}
/* tap-twice confirm for destructive buttons */
function armButton(btn,label,confirmLabel,fn){
 btn.textContent=label;btn.classList.remove("arm");let armed=false,timer;
 btn.onclick=()=>{if(!armed){armed=true;btn.classList.add("arm");btn.textContent=confirmLabel;timer=setTimeout(()=>{armed=false;btn.classList.remove("arm");btn.textContent=label},3500);return}
  clearTimeout(timer);armed=false;fn()};
}
function daysSince(d){if(!d)return Infinity;return Math.floor((Date.now()-new Date(d+"T12:00:00").getTime())/864e5)}

/* ================= Konker (ኮንከር) rules engine =================
   Card: {id, s:"S"|"H"|"D"|"C"|null, r:1..13, j:true for jokers}
   A group is exactly 3 cards (Tris ትሪስ) or 4 cards (Quatris ኳትሪስ):
   a run in one suit, or the same rank in different suits.
   To win: 3 Tris + 1 Quatris (13 cards, counting the groups shown on the table). */
const KSUITS=["S","H","D","C"];
/* Seka on Medium/Hard: ace is low only (no Q-K-A). Konker and Seka Easy: ace can also be high. */
var kAceHigh=true;
function kDeck(decks,noJokers){const d=[];let id=0;for(let k=0;k<decks;k++){for(const s of KSUITS)for(let r=1;r<=13;r++)d.push({id:id++,s,r,j:false});if(!noJokers)d.push({id:id++,s:null,r:0,j:true},{id:id++,s:null,r:0,j:true})}return d}
function kShuffle(a){a=a.slice();for(let n=0;n<3;n++)for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const kRankVal=r=>r>=11?10:r;                 // same-rank groups: ace is 1, J/Q/K are 10
const kRunVal=v=>v===14?11:v>=11?10:v;        // runs: ace low is 1, ace after the king (14) is 11
/* Check a group. Returns {type,size,value,order:[ids],as:{jokerId:{r,s}}} or null */
function kMeld(cards,ext){
 if(!cards||cards.length<3||cards.length>(ext?14:4))return null;
 const real=cards.filter(c=>!c.j),jokers=cards.filter(c=>c.j);
 if(!real.length||jokers.length>real.length)return null;
 if(real.every(c=>c.r===real[0].r)&&new Set(real.map(c=>c.s)).size===real.length&&(cards.length<=4||(ext&&cards.length===5&&jokers.length))){
  const r=real[0].r,free=KSUITS.filter(s=>!real.some(c=>c.s===s)),as={};
  jokers.forEach((j,i)=>as[j.id]={r,s:free[i]||null});
  return{type:"set",size:cards.length,value:kRankVal(r)*cards.length,order:real.map(c=>c.id).concat(jokers.map(j=>j.id)),as};
 }
 if(!real.every(c=>c.s===real[0].s))return null;
 const s=real[0].s;let best=null;
 for(const high of kAceHigh?[false,true]:[false]){
  const ranks=real.map(c=>c.r===1&&high?14:c.r);
  if(new Set(ranks).size!==ranks.length)continue;
  const min=Math.min(...ranks),max=Math.max(...ranks),lo=high?2:1,hi=high?14:13;
  if(min<lo||max>hi)continue;
  const gaps=max-min+1-ranks.length;if(gaps>jokers.length)continue;
  let extra=jokers.length-gaps,a=min,b=max;
  while(extra>0&&b<hi){b++;extra--}while(extra>0&&a>lo){a--;extra--}
  if(extra>0)continue;
  const order=[],as={};let ji=0,value=0;
  for(let v=a;v<=b;v++){const i=ranks.indexOf(v);value+=kRunVal(v);
   if(i>=0)order.push(real[i].id);else{const j=jokers[ji++];order.push(j.id);as[j.id]={r:v===14?1:v,s}}}
  if(!best||value>best.value)best={type:"run",size:cards.length,value,order,as};
 }
 return best;
}
/* every valid 3- and 4-card group in a list of cards, with a bit mask of positions */
function kGroups(cards){const n=cards.length,out=[];
 for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++){
  const m3=kMeld([cards[a],cards[b],cards[c]]);if(m3)out.push({idx:[a,b,c],mask:(1<<a)|(1<<b)|(1<<c),size:3,value:m3.value});
  for(let d=c+1;d<n;d++){const m4=kMeld([cards[a],cards[b],cards[c],cards[d]]);if(m4)out.push({idx:[a,b,c,d],mask:(1<<a)|(1<<b)|(1<<c)|(1<<d),size:4,value:m4.value})}}
 return out}
/* groups still needed to win, given the groups already shown on the table */
function kNeed(table){const t=3-table.filter(g=>g.length===3).length,q=1-table.filter(g=>g.length===4).length;return{t:Math.max(0,t),q:Math.max(0,q)}}
/* exact win check: cards must split into need.t Tris + need.q Quatris (and total >= minSum). Returns [[cards]] or null */
function kWin(cards,need,minSum){
 if(cards.length!==need.t*3+need.q*4)return null;const n=cards.length;if(!n)return[];
 const gs=kGroups(cards),by=[...Array(n)].map(()=>[]);gs.forEach(g=>by[g.idx[0]].push(g));
 let found=null;
 const dfs=(used,t,q,chosen,sum)=>{if(found)return;let i=0;while(i<n&&used&(1<<i))i++;
  if(i===n){if(sum>=(minSum||0))found=chosen.map(g=>g.idx.map(k=>cards[k]));return}
  for(const g of by[i]){if(g.mask&used)continue;if(g.size===3&&t<=0)continue;if(g.size===4&&q<=0)continue;
   chosen.push(g);dfs(used|g.mask,t-(g.size===3),q-(g.size===4),chosen,sum+g.value);chosen.pop();if(found)return}};
 dfs(0,need.t,need.q,[],0);return found}
/* best non-overlapping groups (most cards covered) — used by the computer players and "Group my cards" */
function kCover(cards,qMax,skipIdx){const n=cards.length,gs=kGroups(cards).filter(g=>skipIdx==null||!(g.mask&(1<<skipIdx)));
 const by=[...Array(n)].map(()=>[]);gs.forEach(g=>g.idx.forEach(i=>by[i].push(g)));
 let best={cov:-1,groups:[]},nodes=0;const start=skipIdx==null?0:(1<<skipIdx),total=n-(skipIdx==null?0:1);
 const dfs=(used,cov,q,chosen,left)=>{if(++nodes>60000)return;if(cov+left<=best.cov)return;let i=0;while(i<n&&used&(1<<i))i++;
  if(i===n){if(cov>best.cov)best={cov,groups:chosen.slice()};return}
  for(const g of by[i]){if(g.mask&used)continue;if(g.size===4&&q>=qMax)continue;chosen.push(g);dfs(used|g.mask,cov+g.size,q+(g.size===4),chosen,left-g.size);chosen.pop()}
  dfs(used|(1<<i),cov,q,chosen,left-1)};
 dfs(start,0,0,[],total);return best}
/* how promising a hand is: cards already in groups, plus pairs that could grow into groups */
function kScore(cards,need,skipIdx){const cv=kCover(cards,need.q,skipIdx);const inG=new Set();cv.groups.forEach(g=>g.idx.forEach(i=>inG.add(i)));
 const loose=cards.filter((c,i)=>i!==skipIdx&&!inG.has(i));let p=0;
 loose.forEach((c,i)=>{if(c.j){p+=6;return}loose.forEach((o,k)=>{if(k<=i||o.j)return;if(o.r===c.r&&o.s!==c.s)p+=3;else if(o.s===c.s){const d=Math.abs(o.r-c.r);if(d===1)p+=3;else if(d===2)p+=2;else if((c.r===1&&o.r>=12)||(o.r===1&&c.r>=12))p+=2}})});
 return cv.cov*10+p}
/* ways to lay down 41: any number of groups (at most 3 Tris and 1 Quatris), one of them using card mustId, adding up to 41+.
   Each result: {groups:[[cards]], sum, mask}. Stops growing a combination as soon as it reaches 41. */
function kOpenings(cards,mustId){const gs=kGroups(cards),mi=cards.findIndex(c=>c.id===mustId),out=[];if(mi<0)return out;
 const dfs=(chosen,mask,sum,t,q,from)=>{if(out.length>=300)return;if(sum>=41){out.push({groups:chosen.map(g=>g.idx.map(k=>cards[k])),sum,mask});return}
  for(let k=from;k<gs.length;k++){const g=gs[k];if(g.mask&mask)continue;if(g.size===3&&t>=3)continue;if(g.size===4&&q>=1)continue;if(g.mask&(1<<mi))continue;
   chosen.push(g);dfs(chosen,mask|g.mask,sum+g.value,t+(g.size===3),q+(g.size===4),k+1);chosen.pop()}};
 for(const g of gs)if(g.mask&(1<<mi))dfs([g],g.mask,g.value,g.size===3?1:0,g.size===4?1:0,0);
 return out}
/* split the cards a player picked into groups for laying down 41 (3 or 4 cards each, at most 3 Tris and 1 Quatris). Best total, or null */
function kSplit(cards,mustId){const n=cards.length;if(n<3||n>13)return null;if(mustId!=null&&!cards.some(c=>c.id===mustId))return null;
 const gs=kGroups(cards),by=[...Array(n)].map(()=>[]);gs.forEach(g=>by[g.idx[0]].push(g));let best=null;
 const dfs=(used,t,q,chosen,sum)=>{let i=0;while(i<n&&used&(1<<i))i++;
  if(i===n){if(!best||sum>best.sum)best={groups:chosen.map(g=>g.idx.map(k=>cards[k])),sum};return}
  for(const g of by[i]){if(g.mask&used)continue;if(g.size===3&&t>=3)continue;if(g.size===4&&q>=1)continue;chosen.push(g);dfs(used|g.mask,t+(g.size===3),q+(g.size===4),chosen,sum+g.value);chosen.pop()}};
 dfs(0,0,0,[],0);return best}
/* every way the jokers in a group can be read: [{as:{jokerId:{r,s}}, value, key}] best value first */
function kJokerOptions(cards){const jokers=cards.filter(c=>c.j),real=cards.filter(c=>!c.j);if(!jokers.length||!kMeld(cards))return[];const out=[],seen=new Set();
 const push=(as,value)=>{const key=jokers.map(j=>as[j.id].r+as[j.id].s).sort().join(",");if(seen.has(key))return;seen.add(key);out.push({as,value,key})};
 if(real.every(c=>c.r===real[0].r)&&new Set(real.map(c=>c.s)).size===real.length){const r=real[0].r,free=KSUITS.filter(s=>!real.some(c=>c.s===s)),v=kRankVal(r)*cards.length;

  iSettle(true)}
 saveG()}
function iTake(wIds,owners){const ws=G.wot.filter(c=>wIds.includes(c.id));G.wot=G.wot.filter(c=>!wIds.includes(c.id));G.gain.push(...ws);
 owners.forEach(o=>{const st=G.piles[o].pop();if(st)G.gain.push(...st)});pickW.clear();pickO.clear();hintW.clear();hintO.clear();
 if(!iMore())iSettle(true);saveG()}
function iSettle(won){const me=G.turn,d=G.drawn;
 if(G.last){G.gain.push(...G.wot);G.wot=[];won=true;G.log=GS("iLast",me)}
 if(won){const under=G.watered&&G.piles[me].length?G.piles[me].pop():[];G.piles[me].push([d].concat(G.gain,under));
  if(!G.last&&!d.j)G.log=G.watered&&!G.gain.length?GS("iWatered",me):GS("iTook",me,G.gain.length+1)}else{G.wot.push(d);G.log=GS("iMiss",me)}
 G.drawn=null;G.gain=[];G.watered=false;
 if(G.last||G.circle.every(x=>!x)){endI();return}
 if(won)G.phase="draw";else{G.turn=(G.turn+1)%G.seats.length;G.phase="draw"}}
function endI(){G.phase="over";const counts=G.seats.map((_,o)=>iCount(o)),mx=Math.max(...counts),top=counts.map((c,o)=>c===mx?o:-1).filter(o=>o>=0);
 const w=top.length===1?top[0]:null;G.over={w,counts};track("round-end",{result:w==null?"tie":G.seats[w].kind==="cpu"?"ipad":"player"});
 G.seats.forEach((s,i)=>{if(s.kind!=="human")return;const p=players[s.pid];p.iRounds=(p.iRounds||0)+1;const d=dayStr();if(!p.days.includes(d))p.days.push(d);
  if(i===w){p.pts+=20;p.iWins=(p.iWins||0)+1;p.hist.unshift({d,v:0,pts:20,g:"i"});p.hist=p.hist.slice(0,30)}saveP(s.pid)});
 saveG();if(w!=null&&G.seats[w].kind!=="cpu")setTimeout(()=>cheer(GS("iWins",w),G.seats.map((_,o)=>seatName(o)+" "+counts[o]).join(" · "),20),600)}
/* the computer player (2-player games only) */
async function cpuTurnI(){if(busy)return;busy=true;
 while(G&&G.game==="injera"&&G.phase!=="over"&&!isHuman(G.turn)&&view==="injera"){
  renderI();await wait(800);
  if(G.phase==="draw"){const free=G.circle.map((c,i)=>c?i:-1).filter(i=>i>=0);iDraw(free[Math.floor(Math.random()*free.length)]);renderI();await wait(900);continue}
  if(G.phase==="capture"){let b=iBest();if(b.water){hintO.add(G.turn);renderI();await wait(1000);iWater();renderI();await wait(500);if(G.phase!=="capture")continue;b=iBest()}
   if(b.groups.length||b.owners.length){b.groups.forEach(g=>g.forEach(k=>hintW.add(G.wot[k].id)));b.owners.forEach(o=>hintO.add(o));renderI();await wait(1200);
    iTake([].concat(...b.groups).map(k=>G.wot[k].id),b.owners)}else{iSettle(false);saveG()}renderI();await wait(500)}}
 busy=false;renderI()}
function resumeI(){if(!G||G.game!=="injera"||G.phase==="over"||busy||view!=="injera")return;if(!isHuman(G.turn))cpuTurnI()}
const cName=c=>c.j?"Joker":RL(c.r)+SYM[c.s]+"︎";
function renderI(){if(!G||G.game!=="injera")return;const myTurn=isHuman(G.turn)&&!busy&&G.phase!=="over",cap=myTurn&&G.phase==="capture";
 $("iTag").textContent=t("iTitle")+" · "+L().round(G.round);
 // players and their መደብ
 const pb=$("iPlayers");pb.innerHTML="";
 G.seats.forEach((s,o)=>{const tp=iTop(o),canPick=cap&&o!==G.turn&&tp;const box=document.createElement(canPick?"button":"div");if(canPick)box.type="button";
  box.className="mpile"+(o===G.turn&&G.phase!=="over"?" turn":"");
  if(tp){const ce=cardEl(tp);if(pickO.has(o))ce.classList.add("pick");if(hintO.has(o))ce.classList.add("hint");box.appendChild(ce)}else{const e=document.createElement("div");e.className="nop";box.appendChild(e)}
  const txt=document.createElement("span");txt.innerHTML="<b></b><br><span class='cnt'></span>";txt.querySelector("b").textContent=seatName(o)+" · "+t("mdebL");txt.querySelector(".cnt").textContent=L().cards(iCount(o));box.appendChild(txt);
  if(canPick)box.onclick=()=>{pickO.has(o)?pickO.delete(o):pickO.add(o);imsg="";renderI()};pb.appendChild(box)});
 // the circle (እንጀራ)
 const ring=$("ring");[...ring.querySelectorAll(".slot")].forEach(e=>e.remove());const N=G.circle.length,cw=N>60?30:N>40?38:44;
 G.circle.forEach((c,i)=>{if(!c)return;const a=360*i/N,rad=a*Math.PI/180;const b=cardEl(null,{back:true});const el=document.createElement("button");el.type="button";
  el.className="card back slot";el.dataset.slot=i;el.style.setProperty("--cw",cw+"px");el.style.left=(50+43*Math.cos(rad)).toFixed(2)+"%";el.style.top=(50+43*Math.sin(rad)).toFixed(2)+"%";
  el.style.transform="translate(-50%,-50%) rotate("+(a+90).toFixed(1)+"deg)";el.disabled=!(myTurn&&G.phase==="draw");el.setAttribute("aria-label","Face-down card");
  el.onclick=()=>{if(!(isHuman(G.turn)&&G.phase==="draw"&&!busy))return;iDraw(i);imsg="";renderI();resumeI()};ring.insertBefore(el,ring.firstChild)});
 // the ወጥ
 const wb=$("wot");wb.innerHTML="";wb.className="wot"+(G.wot.length>18?" lots":G.wot.length>9?" many":"");
 if(!G.wot.length){const e=document.createElement("div");e.className="empty";e.textContent=t("iEmpty");wb.appendChild(e)}
 G.wot.forEach(c=>{const b=cardEl(c,{button:true});b.disabled=!cap;if(pickW.has(c.id))b.classList.add("pick");if(hintW.has(c.id))b.classList.add("hint");
  b.onclick=()=>{if(!cap)return;pickW.has(c.id)?pickW.delete(c.id):pickW.add(c.id);imsg="";renderI()};wb.appendChild(b)});
 // drawn card
 const dr=$("iDrawn");dr.innerHTML="";if(G.drawn)dr.appendChild(cardEl(G.drawn));$("iDrawnL").textContent=G.drawn?L().iDrewL(cName(G.drawn)):"";$("iGain").textContent=G.drawn&&G.gain.length?L().iGainL(G.gain.length):"";
 let st="";if(G.phase!=="over"){if(!isHuman(G.turn))st=GS("iOtherSt",G.turn);else st=G.phase==="draw"?GS("iDrawSt",G.turn):GS("iCapSt",G.turn)}$("iStatus").textContent=st;
 const m=$("iMsg");m.textContent=imsg||G.log||"";m.className="msg "+(imsg&&imsgErr?"err":"log");
 ["iTakeBtn","iNoneBtn","iHintBtn","iWaterBtn","iGrabBtn"].forEach(id=>$(id).hidden=!cap);$("iGrabBtn").hidden=!cap||!G.seats.some((_,o)=>o!==G.turn&&iTop(o));$("iWaterBtn").disabled=!!G.watered;
 $("iQuitBtn").textContent=iQuitArm?t("quitC"):t("quit");$("iOver").hidden=G.phase!=="over";renderRate();
 if(G.phase==="over"){const o=G.over;$("iOverTitle").textContent=o.w==null?t("iTie"):GS("iWins",o.w);$("iOverSub").textContent=G.seats.map((_,k)=>seatName(k)+": "+o.counts[k]).join(" · ")}}
const isay=(k)=>{imsg=t(k);imsgErr=true;renderI()};
/* ውሰድ: cards from the ወጥ */
$("iTakeBtn").onclick=()=>{const d=G.drawn;if(!d)return;if(!pickW.size){isay(pickO.size?"ieUseGrab":"iePick");return}
 const ws=G.wot.filter(c=>pickW.has(c.id));if(iCover(ws,d.r).reduce((a,g)=>a+g.length,0)!==ws.length){isay("ieSum");return}
 imsg="";const keepO=new Set(pickO);iTake(ws.map(c=>c.id),[]);if(G.phase==="capture")keepO.forEach(o=>pickO.add(o));renderI();resumeI()};
/* ግፈፍ (መግፍ): the top of another player's መደብ with the same card */
$("iGrabBtn").onclick=()=>{const d=G.drawn;if(!d)return;let os=[...pickO];const others=G.seats.map((_,o)=>o).filter(o=>o!==G.turn&&iTop(o));
 if(!os.length){if(others.length===1)os=others;else{isay("ieGrabPick");return}}
 if(os.some(o=>!iOwners(d).includes(o))){isay("ieTop");return}
 const who=os.map(o=>seatName(o)).join(", ");const keepW=new Set(pickW);imsg="";iTake([],os);
 if(G.phase==="capture"){keepW.forEach(id=>pickW.add(id));imsg=L().iGrabbedYou(who);imsgErr=false}else G.log=GS("iGrabbed",G.turn,who);saveG();renderI();resumeI()};
$("iNoneBtn").onclick=()=>{if(iMore()){isay("ieMore");return}imsg="";iSettle(G.gain.length>0);saveG();renderI();resumeI()};
$("iWaterBtn").onclick=()=>{if(!G.drawn)return;if(!iOwnMatch(G.drawn)){isay("ieWater");return}if(!iWater())return;imsg=t("iWateredYou");imsgErr=false;renderI();resumeI()};
$("iHintBtn").onclick=()=>{const b=iBest();hintW.clear();hintO.clear();if(b.water)hintO.add(G.turn);else if(b.owners.length)hintO.add(b.owners[0]);else if(b.groups.length)b.groups[0].forEach(k=>hintW.add(G.wot[k].id));
 if(!hintW.size&&!hintO.size){isay("iHintNone");return}imsg=t("iHintShow");imsgErr=false;renderI()};
$("iAgainBtn").onclick=()=>{dealI();renderI();resumeI()};
$("iChangeBtn").onclick=()=>{G.done=true;saveG();show("setup");renderSetup()};
$("iQuitBtn").onclick=()=>{if(!iQuitArm){iQuitArm=true;renderI();setTimeout(()=>{iQuitArm=false;if(view==="injera")renderI()},3000);return}iQuitArm=false;G.done=true;saveG();show("setup");renderSetup()};

applyLang();show("home");
if(window.APPCFG&&window.APPCFG.store&&!ls.get("namesSet",false)){$("renameBtn").click();$("renameForm").scrollIntoView({block:"center"})}
})();
</script>
