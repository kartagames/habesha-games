<title>Privacy · Habesha Card Games</title><style>
:root{--bg:#EDF1EC;--surface:#fff;--ink:#1C2924;--muted:#566660;--green:#1E5E48;--gold:#C2902A;--berry:#9E3446;--line:#C9D4CD}
@media (prefers-color-scheme:dark){:root{--bg:#121D19;--surface:#1B2A24;--ink:#E7EFEA;--muted:#A3B5AC;--green:#6CC3A0;--gold:#E3B652;--berry:#E07A8A;--line:#33483F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 system-ui,"Kefa",sans-serif}
html[lang="am"] body{font-family:"Kefa",system-ui,sans-serif}
.tibeb{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 14px,var(--gold) 14px 18px,var(--berry) 18px 30px,var(--gold) 30px 34px);border-bottom:4px solid var(--gold)}
main{max-width:900px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.9rem;text-wrap:balance}h2{margin:0;font-size:1.2rem}
.lang,.sw{min-height:52px;padding:8px 20px;border-radius:999px;border:2px solid var(--green);color:var(--green);font:inherit;font-weight:700;background:var(--surface);cursor:pointer}
.lang:focus-visible,.sw:focus-visible,a.app:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
a.app{display:flex;gap:18px;align-items:center;min-height:120px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;color:inherit;text-decoration:none}
a.app:hover{border-color:var(--green)}a.app img{width:88px;height:88px;border-radius:20px;flex:none}a.app b{font-size:1.3rem;display:block}a.app span{color:var(--muted);font-size:1rem}
.box{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.box.gold{border-color:var(--gold)}.box ol,.box ul{margin:0;padding-left:1.3em}.box li{margin:4px 0}
.muted{color:var(--muted);font-size:1rem}a{color:var(--green)}
.box h2{margin-top:6px}.box p{margin:0}table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}pre{white-space:pre-wrap;font-size:.8rem;background:var(--bg);padding:12px;border-radius:10px;overflow-wrap:anywhere}details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}summary{cursor:pointer;font-weight:700}</style></head>

<div class="top"><h1 data-am="ግላዊነት" data-en="Privacy"></h1><button class="lang" type="button" id="langBtn">አማርኛ</button></div>
<p class="muted" data-am="የሐበሻ ካርታ ጨዋታዎች · መጨረሻ የተሻሻለው፦ 6 November 2026" data-en="Habesha Card Games · Last updated: 6 November 2026"></p>
<div class="box"><p data-am="የሐበሻ ካርታ ጨዋታዎች ምንም ግላዊ መረጃ አይሰበስብም፦ ምዝገባ የለም፣ መለያ የለም፣ ኩኪ የለም፤ የሚጽፉት ምንም ነገር ከመሣሪያዎ አይወጣም።" data-en="Habesha Card Games collects no personal information: no sign-up, no account, no cookies, and nothing you type ever leaves your device."></p><h2 data-am="በመሣሪያዎ ላይ ብቻ የሚቀመጡ" data-en="What stays on your device only"></h2><ul><li data-am="ለተጫዋቾች የሚጽፏቸው ስሞች" data-en="The names you type for players"></li><li data-am="የሚመርጡት ጾታ (ወንድ / ሴት)፤ የአማርኛ መልዕክቶች እያንዳንዱን ተጫዋች በትክክል እንዲጠሩ ብቻ" data-en="The gender you choose (ወንድ / ሴት), used only so the Amharic messages address each player correctly"></li><li data-am="ነጥቦች፣ የጨዋታ ታሪክ እና ያልተጨረሱ ጨዋታዎች" data-en="Scores, game history and unfinished games"></li></ul><p data-am="እነዚህ ወደ የትም አይላኩም። መተግበሪያውን መሰረዝ ወይም የአሳሹን የድረ-ገጽ መረጃ ማጽዳት ያጠፋቸዋል።" data-en="These are never sent anywhere. Deleting the app or clearing the browser's website data removes them."></p><h2 data-am="ስም-አልባ የሚቆጠረው" data-en="What is counted, anonymously"></h2><p data-am="ሰዎች የትኞቹን ጨዋታዎች እንደሚወዱ ለማወቅ፣ ጨዋታዎቹ ገጽ ሲከፈት (በቀን አንድ ጊዜ)፣ ጨዋታ ሲጀመር ወይም ዙር ሲያልቅ ትንሽ ስም-አልባ ቆጠራ ይልካሉ። እያንዳንዱ ቆጠራ የሚይዘው እነዚህን ብቻ ነው፦" data-en="To learn which games people enjoy, the games send small anonymous counts when a page is opened (once a day), a game starts, or a round ends. Each count contains only:"></p><ul><li data-am="ጨዋታው (ኮንከር፣ ሴካ፣ እንጀራ በወጥ ወይም ዳማ)" data-en="the game (Konker, Seka, Injera Bewet or Dama)"></li><li data-am="የተጫዋቾች ብዛት፣ እና ከኮምፒውተሩ ወይም እርስ በርስ መሆኑ" data-en="the number of players, and whether they play against the computer or each other"></li><li data-am="ደረጃው፣ ውጤቱ (ተጫዋች፣ ኮምፒውተር ወይም አቻ) እና ጥቂት የጨዋታ ዝርዝሮች (ጆከር አለ ወይም የለም፣ ቫይስ፣ በገቢ መጨረስ)" data-en="the level, the result (player, computer or tie) and a few game details (jokers on or off, a Vice, a ገቢ finish)"></li><li data-am="ከዙር በኋላ ቢነኩ፣ ጨዋታውን ወደዱት ወይ የሚል 👍 ወይም 👎" data-en="if you tap it after a round, a 👍 or 👎 for whether you enjoyed the game"></li><li data-am="የመተግበሪያው ቋንቋ (አማርኛ ወይም እንግሊዝኛ)" data-en="the language of the app (Amharic or English)"></li></ul><p data-am="ቆጠራዎቹ ስም፣ ጾታ፣ ነጥብ ወይም የተጻፈ ምንም ነገር አይይዙም። ከመስመር ውጭ ሲሆኑ ቆጠራዎቹ በመሣሪያው ላይ ይጠብቃሉ፤ ኢንተርኔት ሲገኝ ይላካሉ።" data-en="Counts never include names, gender, scores or anything typed. While offline, counts wait on the device and are sent when it is next online."></p><h2 data-am="ቆጠራውን የሚያስተናግደው" data-en="Who handles the counts"></h2><p data-am="ቆጠራዎቹ በ<a href=&quot;https://umami.is&quot;>Umami Cloud</a> ይስተናገዳሉ፤ ኩኪ የማይጠቀም፣ ለማስታወቂያ የማይውል፣ ግላዊነትን የሚያከብር የትንታኔ አገልግሎት ነው። እንደ ማንኛውም ድረ-ገጽ፣ ቆጠራ ሲደርስ Umami የመሣሪያውን የኢንተርኔት አድራሻ እና የአሳሹን ዓይነት ያገኛል፤ አገርንና የመሣሪያ ዓይነትን ለመገመት ይጠቀምበታል። የሐበሻ ካርታ ጨዋታዎች አድራሻውን ራሱ በፍጹም አያይም።" data-en="Counts are processed by <a href=&quot;https://umami.is&quot;>Umami Cloud</a>, a privacy-focused analytics service that uses no cookies and is not used for advertising. Like any website, Umami receives the device's internet address and browser type when a count arrives, and uses them to estimate country and device type; Habesha Card Games never sees the address itself."></p><h2 data-am="ቆጠራውን ማጥፋት" data-en="Turning counting off"></h2><p data-am="በዋናው ገጽ ላይ «መቁጠር በርቷል · አጥፋ» የሚለውን ይንኩ። ከዚያ በኋላ ምንም አይላክም፤ በመሣሪያው ላይ የሚጠብቁ ቆጠራዎችም ይሰረዛሉ።" data-en="On the main page, tap “Counting is on · Turn off.” Nothing is sent after that, and any counts waiting on the device are deleted."></p><h2 data-am="ኢሜይል ሲልኩልን" data-en="If you email us"></h2><p data-am="«አስተያየት ይላኩ» የኢሜይል መተግበሪያዎን ይከፍታል። ኢሜይል ከላኩ፣ የኢሜይል አድራሻዎን እና የጻፉትን እናያለን፤ ለመመለስ እና ጨዋታዎቹን ለማሻሻል ብቻ እንጠቀምበታለን፤ ለማንም አናጋራም።" data-en="“Send feedback” opens your email app. If you send us an email, we see your email address and what you wrote. We use it only to reply and to improve the games, and never share it."></p><h2 data-am="ልጆች" data-en="Children"></h2><p data-am="ጨዋታዎቹ ለሁሉም ዕድሜ ተስማሚ ናቸው፤ ከማንም፣ ከልጆችም ጭምር፣ ምንም ግላዊ መረጃ አይሰበስቡም።" data-en="The games are suitable for all ages and collect no personal information from anyone, including children."></p><h2 data-am="መገኛ" data-en="Contact"></h2><p data-am="ስለ ግላዊነት ጥያቄ፦ <a href=&quot;mailto:kartagames@protonmail.com&quot;>kartagames@protonmail.com</a>። ይህ መግለጫ ከተቀየረ፣ የተሻሻለው በዚህ ገጽ ላይ በአዲስ ቀን ይለጠፋል።" data-en="Questions about privacy: <a href=&quot;mailto:kartagames@protonmail.com&quot;>kartagames@protonmail.com</a>. If this note changes, the updated version will be posted on this page with a new date."></p></div>

</main><script>
(function(){
  var lang="en";try{lang=localStorage.getItem("games.lang")||((navigator.language||"").indexOf("am")===0?"am":"en")}catch(e){}
  function apply(){document.documentElement.lang=lang;
    document.querySelectorAll("[data-am]").forEach(function(el){el.innerHTML=el.getAttribute(lang==="am"?"data-am":"data-en")});
    var b=document.getElementById("langBtn");if(b)b.textContent=lang==="am"?"English":"አማርኛ";if(window.onLang)window.onLang(lang)}
  document.getElementById("langBtn").onclick=function(){lang=lang==="am"?"en":"am";try{localStorage.setItem("games.lang",lang)}catch(e){}apply()};
  window.addEventListener("pageshow",function(){try{var l=localStorage.getItem("games.lang");if(l&&l!==lang){lang=l;apply()}}catch(e){}});
  apply();
})();
</script></body></html>
