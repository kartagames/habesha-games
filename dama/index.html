:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one calm column under a woven tibeb band; oversized touch targets for older hands */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --ink:#1C2924; --muted:#566660;
  --green:#1E5E48; --green-soft:#D6E7DE; --gold:#C2902A; --gold-soft:#F4E6C4;
  --berry:#9E3446; --berry-soft:#F6DDE1; --line:#C9D4CD; --ok:#2E7D4F; --warn:#B4532A;
  --f-body:"Atkinson Hyperlegible","Fidel Serif","Kefa",system-ui,sans-serif;
  --f-geez:"Fidel Serif","Kefa",serif;
  --r:18px;
  --back:repeating-linear-gradient(45deg,var(--green) 0 10px,var(--gold) 10px 14px,var(--berry) 14px 22px,var(--gold) 22px 26px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121D19; --surface:#1B2A24; --ink:#E7EFEA; --muted:#A3B5AC;
  --green:#6CC3A0; --green-soft:#24443A; --gold:#E3B652; --gold-soft:#43381E;
  --berry:#E07A8A; --berry-soft:#4A2730; --line:#33483F; --ok:#6FD39A; --warn:#F09A6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121D19; --surface:#1B2A24; --ink:#E7EFEA; --muted:#A3B5AC;
  --green:#6CC3A0; --green-soft:#24443A; --gold:#E3B652; --gold-soft:#43381E;
  --berry:#E07A8A; --berry-soft:#4A2730; --line:#33483F; --ok:#6FD39A; --warn:#F09A6E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang="am"] body{font-family:"Fidel Serif","Kefa",var(--f-body)}
.tibeb{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 14px,var(--gold) 14px 18px,var(--berry) 18px 30px,var(--gold) 30px 34px);border-bottom:4px solid var(--gold)}
.tibeb.thin{height:10px;border-bottom-width:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
.view{display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
.muted{color:var(--muted)} .small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{min-height:60px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--green);color:var(--surface)}
.btn.ghost{background:var(--surface);border:2px solid var(--line)}
.btn.gold{background:var(--gold-soft);border:2px solid var(--gold)}
.btn:disabled{opacity:.45;cursor:default}

/* Home */

.rename{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.names-form{flex-direction:column;align-items:flex-start;gap:12px;width:100%}

.nfield{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}

.linkish{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 4px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
@media (min-width:700px){.games{grid-template-columns:repeat(2,1fr)}}
.game-card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:24px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:250px}
.game-card:hover{border-color:var(--green)}
.game-card .glyph{font-family:var(--f-geez);font-size:2.4rem;line-height:1;color:var(--green);display:flex;gap:6px}

.mini-grid{display:grid;grid-template-columns:repeat(4,40px);gap:3px;font-family:var(--f-geez);font-weight:700;font-size:1.3rem}
.mini-grid span{height:40px;display:grid;place-items:center;background:var(--bg);border-radius:6px}
.mini-grid span.g{background:var(--gold-soft)}

.scorebtn{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--gold-soft);border:2px solid var(--gold);border-radius:var(--r);padding:18px 22px;text-align:left}

/* Word builder */
.progress{display:flex;gap:6px;flex-wrap:wrap;max-width:100%}
.progress i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.progress i.ok{background:var(--ok);border-color:var(--ok)}
.progress i.half{background:var(--gold);border-color:var(--gold)}
.progress i.miss{background:var(--line)}
.progress i.now{border-color:var(--green);border-width:4px}
.lvl{display:inline-flex;align-items:center;gap:10px}

.slots,.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.slot,.tile{width:78px;height:86px;border-radius:16px;font-family:var(--f-geez);font-size:2.6rem;font-weight:700;display:grid;place-items:center;line-height:1}

.slots.wrong{animation:shake .4s}
.tile{background:var(--gold-soft);border:3px solid var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold)}
.tile.used{visibility:hidden}
@media (max-width:480px){.slot,.tile{width:62px;height:70px;font-size:2.1rem}}
.feedback{min-height:1.6em;font-size:1.25rem;font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.result{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.big-score{font-size:3.6rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}

.review span b{font-family:var(--f-geez);font-size:1.3rem;margin-right:8px}

/* Sudoku */
.seg{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px}

.clue .q{font-size:1.4rem;font-weight:700}
.sgrid{display:grid;width:min(100%,540px);margin:0 auto;border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.cell{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--surface);font-family:var(--f-geez);font-weight:700;font-size:clamp(1.5rem,7vw,2.8rem);color:var(--green);line-height:1}

.cell.given{color:var(--ink)}
.cell.ans{background:var(--gold-soft)}
.cell.zone{background:var(--green-soft)}
.cell.ans.zone{background:var(--gold-soft);box-shadow:inset 0 0 0 999px rgba(30,94,72,.12)}
.cell.same{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}

.cell.bad{color:var(--berry);background:var(--berry-soft)}
.cell.br{border-right:3px solid var(--ink)} .cell.bb{border-bottom:3px solid var(--ink)}
.sgrid.won .cell.ans{background:var(--gold);color:var(--surface)}
.pad{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:16px;background:var(--gold-soft);border:3px solid var(--gold);font-family:var(--f-geez);font-size:2.2rem;font-weight:700;box-shadow:0 4px 0 var(--gold)}
.pad button.erase{font-family:var(--f-body);font-size:1rem;width:auto;padding:0 18px;background:var(--surface);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.legend{display:flex;align-items:center;gap:10px;justify-content:center;font-size:.95rem;color:var(--muted)}
.legend i{width:22px;height:22px;border-radius:5px;background:var(--gold-soft);border:2px solid var(--gold)}
.reveal{font-family:var(--f-geez);font-size:2.6rem;font-weight:700;color:var(--green)}

/* Scores */
.tiles4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}

/* Family quiz */

.mini-board{display:grid;grid-template-columns:repeat(3,52px);gap:4px}
.mini-board span{height:30px;border-radius:6px;background:var(--gold-soft);border:2px solid var(--gold);font-weight:700;font-size:.8rem;display:grid;place-items:center}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:60px;padding:8px 22px;border-radius:999px;border:3px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.famrow{display:grid;grid-template-columns:60px 1fr 1fr;gap:10px;align-items:center}

.scores-row{display:flex;gap:10px;flex-wrap:wrap}

.sc{flex:1 1 150px;border-radius:14px;border:3px solid var(--line);background:var(--surface);padding:10px 16px}
.sc.pick{border-color:var(--green);background:var(--green-soft)}
.sc .nm{font-weight:700}
.sc b{font-size:1.9rem;display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.qboard-wrap{overflow-x:auto;padding-bottom:6px}
.qboard{display:grid;gap:8px;min-width:520px}
.qhead{background:var(--green);color:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:88px}
.qhead .a{font-family:var(--f-geez);font-weight:700;font-size:1.05rem;line-height:1.25}
.qhead .e{font-size:.78rem;opacity:.9;line-height:1.2}
.qcell{min-height:74px;border-radius:12px;background:var(--gold-soft);border:3px solid var(--gold);font-size:1.6rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--gold)}
.qcell.used{background:var(--bg);border-color:var(--line);box-shadow:none;color:transparent;cursor:default}
.qcard{display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.qcard .qa{font-family:var(--f-geez);font-size:1.9rem;font-weight:700;text-wrap:balance;line-height:1.35}
.qcard .qe{font-size:1.2rem;color:var(--muted);text-wrap:balance}

/* Fidel chart puzzle */
.mini-chart{display:grid;grid-template-columns:repeat(4,40px);gap:3px;font-family:var(--f-geez);font-weight:700;font-size:1.25rem}

.mini-chart span.g{background:var(--green-soft)}.mini-chart span.e{background:var(--bg)}
.slstats{display:flex;gap:22px;font-size:1.05rem}.slstats b{font-variant-numeric:tabular-nums;font-size:1.25rem}
.note8{background:var(--gold-soft);border-radius:14px;padding:10px 16px;font-size:1rem}
.sboard-wrap{overflow-x:auto}
.sboard{position:relative;width:100%;margin:0 auto;background:var(--bg);border:4px solid var(--ink);border-radius:14px;min-width:320px}
.stile{position:absolute;width:calc(100% / var(--c));height:calc(100% / var(--r));padding:3px;transition:left .14s ease,top .14s ease}
.stile span{display:grid;place-items:center;width:100%;height:100%;border-radius:10px;background:var(--gold-soft);border:2px solid var(--gold);
 font-family:var(--f-geez);font-weight:700;font-size:var(--fs,28px);line-height:1;color:var(--ink);box-shadow:0 3px 0 var(--gold)}

.mini-dama{display:grid;grid-template-columns:repeat(4,38px);border:5px solid #5a3214;border-radius:6px;width:max-content}
.mini-dama span{height:38px;background:linear-gradient(160deg,#eed6ab,#d8b37c);display:grid;place-items:center}

.mini-dama i.d{background:radial-gradient(circle at 35% 30%,#7a3a22,#2a0d05)}.mini-dama i.l{background:radial-gradient(circle at 35% 30%,#fff8e6,#c8a06a)}
.dm-opts{display:flex;flex-direction:column;gap:18px}

.swatch.pl{background:radial-gradient(circle at 35% 30%,var(--pl1),var(--pl2) 55%,var(--pl3));box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.dframe{width:100%;max-width:640px;margin:0 auto;padding:clamp(10px,3.4%,22px);border-radius:16px;
 background:repeating-linear-gradient(87deg,rgba(255,255,255,.06) 0 2px,transparent 2px 10px),repeating-linear-gradient(93deg,rgba(0,0,0,.14) 0 1px,transparent 1px 14px),linear-gradient(135deg,var(--fr1),var(--fr2) 45%,var(--fr3));
 box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.45),0 12px 26px rgba(0,0,0,.28)}
.dboard{position:relative;display:block;width:100%;height:0;padding-top:100%;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px var(--fr3),inset 0 0 14px rgba(0,0,0,.35)}

.dsq.hintsq::before{content:"";position:absolute;inset:5%;border:4px solid #ffd166;border-radius:8px;background:rgba(255,214,102,.18)}
.dsq.target::after{content:"";position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;background:#3fbf6e;box-shadow:0 0 0 5px rgba(63,191,110,.35)}
.dsq:focus-visible{outline:3px solid #ffd166;outline-offset:-3px}
.dlayer{position:absolute;inset:0;pointer-events:none}
.dpc{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;transition:left .28s ease,top .28s ease,opacity .3s}
.dpc .disc{width:80%;height:80%;border-radius:50%;display:grid;place-items:center;position:relative}
.dpc .disc::before{content:"";position:absolute;inset:15%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(0,0,0,.11) 3px 4px)}
.pd .disc{background:radial-gradient(circle at 35% 30%,var(--pd1),var(--pd2) 58%,var(--pd3));box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),inset 0 -5px 8px rgba(0,0,0,.55),0 4px 6px rgba(0,0,0,.5)}
.pl .disc{background:radial-gradient(circle at 35% 30%,var(--pl1),var(--pl2) 55%,var(--pl3));box-shadow:inset 0 0 0 3px rgba(120,80,30,.15),inset 0 -5px 8px rgba(120,80,30,.35),0 4px 6px rgba(0,0,0,.45)}
.crown{width:56%;height:56%;color:#e8b53e;display:none;position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.crown svg{width:100%;height:100%;display:block}
.pl .crown{color:#9a6a17;filter:none}
.king .crown{display:block}
.sel .disc{outline:4px solid #ffd166;outline-offset:3px}
.dpc.gone{opacity:.25}
.cap{position:absolute;inset:0;display:none}.cap svg{width:100%;height:100%;display:block}
.caps .cap{display:block}
.caps .dpc .disc{background:none;box-shadow:0 3px 5px rgba(0,0,0,.45)}
.caps .dpc .disc::before{display:none}
.caps .king .crown,.caps .king .crown svg{color:#ffd166}
.caps .king .crown{background:rgba(0,0,0,.6);border-radius:50%;padding:7%;width:50%;height:50%;box-sizing:border-box}
.capsmode .swatch{background:none!important;box-shadow:none!important}.capsmode .swatch svg{width:100%;height:100%;display:block}
#v-dama{--pd1:#7a3a22;--pd2:#45190b;--pd3:#2a0d05;--pl1:#fff8e6;--pl2:#f0dcb2;--pl3:#c8a06a;--lt1:#eed6ab;--lt2:#d8b37c;--dk1:#8e5b2c;--dk2:#683c1b;--fr1:#4a2810;--fr2:#6e3f1c;--fr3:#3b1f0b}
.dm-choices{display:flex;flex-wrap:wrap;gap:10px}
.dmc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;border:3px solid var(--line);background:var(--surface);min-width:104px;max-width:150px;text-align:center}
.dmc[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.dmc .lb{font-size:.9rem;font-weight:700;line-height:1.25}
.dmc .pv{display:flex;gap:4px;align-items:center;justify-content:center;min-height:54px}
.dmc .pv i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.dmc .mb{display:grid;grid-template-columns:repeat(2,24px);border:5px solid;border-radius:4px}.dmc .mb s{height:24px;display:block}
.dmc .cp{width:54px;height:54px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}.dmc .cp svg{width:100%;height:100%}
.dm-rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:1.02rem}
@media (prefers-reduced-motion:reduce){.dpc{transition:none}}
/* Cheer */
#cheer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.28)}
#cheer canvas{position:absolute;inset:0;width:100%;height:100%}
#cheer .msg{position:relative;background:var(--surface);border:4px solid var(--gold);border-radius:24px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:10px;max-width:min(92vw,480px);box-shadow:0 20px 60px rgba(0,0,0,.25)}

#cheer .msg .pts{font-size:1.5rem;font-weight:700;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.slots.wrong{animation:none}}

.rate{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;padding:6px 0}.rate button{min-width:64px;min-height:52px;font-size:1.6rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer}.rate button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

</head>

function family(ch){const c=ch.codePointAt(0);const b=c-((c-0x1200)%8);if(c<0x1200||c>0x1357||!BASESET.has(b)||(c-b)>6)return[];return[0,1,2,3,4,5,6].map(o=>String.fromCodePoint(b+o)).filter(x=>x!==ch)}

function rng(seedStr){let h=1779033703^seedStr.length;for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let r=Math.imul(a^a>>>15,1|a);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}

 const name="brain-games-backup-"+dayStr()+".json",text=JSON.stringify(data);
 try{const file=new File([text],name,{type:"application/json"});

   players=d.players.slice(0,3).map(p=>Object.assign(blankPlayer(),p));while(players.length<3)players.push(blankPlayer());

/* ================= Word Builder ================= */
const COUNTS=[8,10,15,20,25];
function levelSpec(L){
 const count=L<=5?COUNTS[L-1]:Math.min(25+5*(L-5),40);
 const decoys=Math.min(L+2,8);
 const range=L===1?[3,3]:L<=3?[3,4]:L===4?[4,5]:[3,7];
 return{count,decoys,range};
}
const levelCache={};
function levelWords(L){
 if(levelCache[L])return levelCache[L];
 const sp=levelSpec(L),r=rng("wb-level-"+L);
 let list=shuffle(WB.filter(w=>w.s.length>=sp.range[0]&&w.s.length<=sp.range[1]),r);
 if(list.length<sp.count)list=list.concat(shuffle(WB.filter(w=>!list.includes(w)&&w.s.length>=3),r));
 while(list.length<sp.count)list=list.concat(shuffle(WB,r));
 return levelCache[L]=list.slice(0,sp.count).map((w,i)=>makeTiles(w,sp.decoys,rng("wb-"+L+"-"+i),L));
}
function makeTiles(w,n,r,L){
 const inWord=new Set(w.s),picked=new Set();
 const similar=shuffle([...new Set(w.s.flatMap(family))].filter(c=>!inWord.has(c)),r);
 const nSim=L===1?1:Math.ceil(n*0.6);
 for(const c of similar){if(picked.size>=nSim)break;picked.add(c)}
 let guard=0;while(picked.size<n&&guard++<200){const b=COMMON[Math.floor(r()*COMMON.length)];const c=String.fromCodePoint(b+Math.floor(r()*7));if(!inWord.has(c))picked.add(c)}
 let tiles;do{tiles=shuffle([...w.s,...picked],r)}while(tiles.filter(c=>inWord.has(c)).join("")===w.w&&w.s.length>1);
 return{...w,tiles};
}

/* ================= Fidel Sudoku ================= */
const DIM={4:[2,2],6:[2,3]};
function countSolutions(g,n,br,bc,limit){
 const i=g.indexOf(-1);if(i<0)return 1;const r=Math.floor(i/n),c=i%n;let cnt=0;
 for(let v=0;v<n;v++){let ok=true;
  for(let k=0;k<n&&ok;k++){if(g[r*n+k]===v||g[k*n+c]===v)ok=false}
  const r0=r-r%br,c0=c-c%bc;for(let a=r0;a<r0+br&&ok;a++)for(let b=c0;b<c0+bc&&ok;b++)if(g[a*n+b]===v)ok=false;
  if(ok){g[i]=v;cnt+=countSolutions(g,n,br,bc,limit);g[i]=-1;if(cnt>=limit)return cnt}}
 return cnt;
}
function newSudoku(n){
 const[br,bc]=DIM[n],r=rng(String(Math.random()));
 const pick=SD[n][Math.floor(r()*SD[n].length)];
 const bandOrder=shuffle([...Array(n/br).keys()],r).flatMap(b=>shuffle([...Array(br).keys()],r).map(x=>b*br+x));
 const stackOrder=shuffle([...Array(n/bc).keys()],r).flatMap(s=>shuffle([...Array(bc).keys()],r).map(x=>s*bc+x));
 const base=(R,C)=>(bc*(R%br)+Math.floor(R/br)+C)%n;
 const g=[];for(let R=0;R<n;R++)for(let C=0;C<n;C++)g.push(base(bandOrder[R],stackOrder[C]));
 const map={};for(let C=0;C<n;C++)map[g[C]]=C; // row 0 spells the word
 const sol=g.map(v=>map[v]);
 const target=n===4?6:15;
 const work=sol.slice();
 for(const i of shuffle([...Array(n*n).keys()],r)){if(work.filter(v=>v>=0).length<=target)break;const keep=work[i];work[i]=-1;
  if(countSolutions(work.slice(),n,br,bc,2)!==1)work[i]=keep}
 // make sure the answer row is never fully given away
 if([...Array(n).keys()].every(C=>work[C]>=0)){for(const C of shuffle([...Array(n).keys()],r)){const k=work[C];work[C]=-1;if(countSolutions(work.slice(),n,br,bc,2)===1)break;work[C]=k}}
 P().sdSize=n;
 P().sd={n,w:pick.w,m:pick.m,a:pick.a,letters:pick.l,sol,given:work.map(v=>v>=0),entry:work.map(v=>v),pad:shuffle([...Array(n).keys()],r),hints:0,won:false,bad:[]};
 sel=-1;save();
}
let sel=-1;
function renderSudoku(){
 const s=P().sd;if(!s)return;const n=s.n,[br,bc]=DIM[n];
 document.querySelectorAll("#sizeSeg button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===n)));
 $("clueText").textContent=s.a||(SD[n].find(x=>x.w===s.w)||{}).a||"";$("clueEn").textContent=s.m;$("clueLen").textContent=T[lang].clueLen(n);
 const grid=$("sgrid");grid.className="sgrid n"+n+(s.won?" won":"");grid.style.gridTemplateColumns=`repeat(${n},1fr)`;grid.innerHTML="";
 const sr=sel>=0?Math.floor(sel/n):-1,scol=sel>=0?sel%n:-1,sv=sel>=0?s.entry[sel]:-1;
 for(let i=0;i<n*n;i++){const R=Math.floor(i/n),C=i%n;const b=document.createElement("button");b.type="button";
  let cls="cell";if(s.given[i])cls+=" given";if(R===0)cls+=" ans";
  if(sel>=0&&(R===sr||C===scol||(Math.floor(R/br)===Math.floor(sr/br)&&Math.floor(C/bc)===Math.floor(scol/bc))))cls+=" zone";
  if(i===sel)cls+=" sel";if(sv>=0&&s.entry[i]===sv&&i!==sel)cls+=" same";if(s.bad.includes(i))cls+=" bad";
  if((C+1)%bc===0&&C<n-1)cls+=" br";if((R+1)%br===0&&R<n-1)cls+=" bb";
  b.className=cls;b.textContent=s.entry[i]>=0?s.letters[s.entry[i]]:"";
  b.setAttribute("aria-label",`row ${R+1} column ${C+1}`);
  b.onclick=()=>{if(s.won)return;sel=i;$("sfb").textContent="";renderSudoku()};grid.appendChild(b)}
 const pad=$("pad");pad.innerHTML="";
 s.pad.forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=s.letters[v];b.onclick=()=>enter(v);pad.appendChild(b)});
 const er=document.createElement("button");er.type="button";er.className="erase";er.textContent=t("clear");er.onclick=()=>enter(-1);pad.appendChild(er);
 pad.hidden=s.won;$("sHint").hidden=s.won;$("sCheck").hidden=s.won;
 $("sWon").hidden=!s.won;if(s.won){$("sReveal").textContent=s.w;$("sRevealMeaning").textContent=(s.a||(SD[n].find(x=>x.w===s.w)||{}).a||"")+" · "+s.m}
}
function enter(v){
 const s=P().sd;if(s.won)return;
 if(sel<0||s.given[sel]){$("sfb").textContent=t("pickCell");$("sfb").className="feedback bad";return}
 s.entry[sel]=v;s.bad=s.bad.filter(i=>i!==sel);save();
 if(s.entry.every((x,i)=>x===s.sol[i]))sudokuWon();else renderSudoku();
}
function sudokuWon(){
 const s=P().sd;s.won=true;sel=-1;
 const pts=Math.max(s.n===4?10:20,(s.n===4?30:60)-5*s.hints);
 P().st.sudokus++;award(pts,T.en.histSudoku(s.w));P().st.hist[0].w=s.w;save();renderSudoku();
 cheer(t("cheerSudoku")+" "+s.w,pts,s.letters);
}
$("sHint").onclick=()=>{const s=P().sd;let i=sel>=0&&!s.given[sel]&&s.entry[sel]!==s.sol[sel]?sel:s.entry.findIndex((x,k)=>x!==s.sol[k]);
 if(i<0)return;s.entry[i]=s.sol[i];s.hints++;s.bad=s.bad.filter(k=>k!==i);sel=i;save();
 if(s.entry.every((x,k)=>x===s.sol[k]))sudokuWon();else renderSudoku()};
$("sCheck").onclick=()=>{const s=P().sd;s.bad=s.entry.map((x,i)=>x>=0&&!s.given[i]&&x!==s.sol[i]?i:-1).filter(i=>i>=0);save();renderSudoku();
 $("sfb").textContent=s.bad.length?T[lang].checkBad(s.bad.length):t("checkOk");$("sfb").className="feedback "+(s.bad.length?"bad":"ok")};

/* ================= Dama (checkers) ================= */
/* Board: 64 squares, index r*8+c; play squares are where (r+c) is odd. "d" = dark pieces (bottom, move first), "l" = light (top). */
const DM_PTS={easy:20,medium:40,hard:70};

function dmInitBoard(){const b=Array(64).fill(null);let id=0;

/* Family rules: ordinary pieces move and capture forward only and can never capture a king;
   kings move one square in any diagonal direction and capture by jumping an adjacent piece (forward or backward),
   chaining jumps only while capturing; kings may capture kings;
   when an ordinary piece can capture, the player must capture; a king's capture is optional. */
const DM_RULES={family:true};
const D4=[[1,1],[1,-1],[-1,1],[-1,-1]];

  const r=Math.floor(i/8),c=i%8,fwd=col==="d"?-1:1;
  const free=x=>!b[x]||x===i; // the moving piece's own start square counts as empty
  const on=(rr,cc)=>rr>=0&&rr<8&&cc>=0&&cc<8;
  const out=p.k?kingJumps:manJumps;
  const dfs=(pos,path,caps,king)=>{const pr=Math.floor(pos/8),pc=pos%8;let ext=false;
   for(const[dr,dc]of(king?D4:[[fwd,1],[fwd,-1]])){
    {const mr=pr+dr,mc=pc+dc,lr=pr+2*dr,lc=pc+2*dc;if(!on(lr,lc))continue;
     const m=mr*8+mc,land=lr*8+lc,q=b[m];if(!q||q.c===col||(q.k&&!king)||caps.includes(m))continue;if(!free(land)||caps.includes(land))continue;
     ext=true;const promo=!king&&lr===(col==="d"?0:7);
     if(promo)out.push({from:i,path:path.concat(land),caps:caps.concat(m)});else dfs(land,path.concat(land),caps.concat(m),king)}}
   if(!ext&&caps.length)out.push({from:i,path,caps})};
  dfs(i,[],[],p.k);
  for(const[dr,dc]of(p.k?D4:[[fwd,1],[fwd,-1]])){let rr=r+dr,cc=c+dc;
   while(on(rr,cc)&&!b[rr*8+cc]){steps.push({from:i,path:[rr*8+cc],caps:[]});break}}

 const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 const cv=$("cheerCanvas"),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
 const W=innerWidth,Hh=innerHeight;cv.width=W*dpr;cv.height=Hh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,Hh);
 if(reduce)return;
 const css=getComputedStyle(document.documentElement);const col=k=>css.getPropertyValue(k).trim();
 const fills=[[col("--gold-soft"),col("--gold")],[col("--green-soft"),col("--green")],[col("--berry-soft"),col("--berry")]];
 const font=getComputedStyle(document.body).getPropertyValue("--f-geez")||"serif";
 const size=Math.max(46,Math.min(72,W/10));
 const L=letters.length?letters:["ደ","ስ"];
 let flying=[],launched=0,last=0,start=performance.now();
 const total=36;
 function launch(){const fromLeft=launched%2===0;const f=fills[launched%3];
  flying.push({x:fromLeft?W*.15+Math.random()*W*.2:W*.65+Math.random()*W*.2,y:40+Math.random()*60,vx:(fromLeft?1:-1)*(2+Math.random()*4)*(Math.random()<.3?-1:1),vy:-Math.random()*6,ch:L[launched%L.length],f});launched++}
 function tileDraw(o){ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle=o.f[0];ctx.strokeStyle=o.f[1];ctx.lineWidth=3;
  const r=10,s=size;ctx.beginPath();ctx.moveTo(-s/2+r,-s/2);ctx.arcTo(s/2,-s/2,s/2,s/2,r);ctx.arcTo(s/2,s/2,-s/2,s/2,r);ctx.arcTo(-s/2,s/2,-s/2,-s/2,r);ctx.arcTo(-s/2,-s/2,s/2,-s/2,r);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=col("--ink");ctx.font=`700 ${s*.6}px ${font}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(o.ch,0,s*.04);ctx.restore()}
 function step(now){
  if(launched<total&&now-last>260){launch();last=now}
  for(const o of flying){o.vy+=.5;o.x+=o.vx;o.y+=o.vy;if(o.y>Hh-size/2){o.y=Hh-size/2;o.vy*=-.78}tileDraw(o)}
  flying=flying.filter(o=>o.x>-size&&o.x<W+size);
  if((launched<total||flying.length)&&now-start<16000)cheerRun=requestAnimationFrame(step);else cheerRun=null;
 }
 cancelAnimationFrame(cheerRun);cheerRun=requestAnimationFrame(step);
}
$("cheerBtn").onclick=()=>{cancelAnimationFrame(cheerRun);cheerRun=null;$("cheer").hidden=true;
 const c=$("cheerCanvas");c.getContext("2d").clearRect(0,0,c.width,c.height);
 if(view==="words")renderWords();if(view==="sudoku")renderSudoku()};

/* ================= boot ================= */
function start(){
 renderAll();show(["home","words","sudoku","scores"].includes(view)?view:"home");
 if(view==="sudoku"&&!P().sd)newSudoku(4);
 renderAll();
}
$("backupBtn").onclick=backup;
$("restoreInput").onchange=e=>{const f=e.target.files[0];if(f)restore(f);e.target.value=""};
start();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){})}</script>
